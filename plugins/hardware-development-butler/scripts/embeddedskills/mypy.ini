[mypy]
python_version = 3.10
# embeddedskills/ is a vendored runtime tree with its own .git and its own
# conventions. The main repo's mypy.ini is too strict for it (warn_return_any
# + check_untyped_defs flag hundreds of subprocess-pipe union-attr and
# no-any-return errors that aren't real bugs). This config relaxes those
# rules so embeddedskills can be type-checked independently without noise.
# The typed core under tools/ stays under the strict root config.
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = false
ignore_missing_imports = true
show_error_codes = true
